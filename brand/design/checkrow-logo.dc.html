<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CheckRow logo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F6FEB}a:hover{color:#1F4FB8}
</style>
</helmet>
<div style="width: 1200px; height: 780px; box-sizing: border-box; padding: 56px 64px; background: #F8F9FB; font-family: Outfit, system-ui, sans-serif; color: #1F2328; display: flex; flex-direction: column; gap: 40px">

<div style="display: flex; gap: 40px; align-items: stretch">
<div style="flex: 1 1 0; background: #FFFFFF; border: 1px solid #E3E6EA; border-radius: 20px; padding: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px">
<svg width="220" height="220" viewBox="0 0 96 96" role="img" aria-label="CheckRow app icon">
<rect x="4" y="4" width="88" height="88" rx="24" fill="#FFFFFF" stroke="#DADCE0" stroke-width="2"></rect>
<path d="M24 46 L40 62" stroke="#22A06B" stroke-width="11" stroke-linecap="round" fill="none"></path>
<path d="M40 62 L72 28" stroke="{{accent}}" stroke-width="11" stroke-linecap="round" fill="none"></path>
<path d="M26 77 H70" stroke="#F2A900" stroke-width="7" stroke-linecap="round" fill="none"></path>
</svg>
<p style="margin: 0; font-size: 15px; color: #5F6368">App icon · white tile</p>
</div>

<div style="flex: 1.4 1 0; display: flex; flex-direction: column; gap: 24px">
<div style="background: #FFFFFF; border: 1px solid #E3E6EA; border-radius: 20px; padding: 40px 44px; display: flex; align-items: center; gap: 22px">
<svg width="84" height="84" viewBox="0 0 96 96" aria-hidden="true">
<rect x="4" y="4" width="88" height="88" rx="24" fill="#FFFFFF" stroke="#DADCE0" stroke-width="2"></rect>
<path d="M24 46 L40 62" stroke="#22A06B" stroke-width="11" stroke-linecap="round" fill="none"></path>
<path d="M40 62 L72 28" stroke="{{accent}}" stroke-width="11" stroke-linecap="round" fill="none"></path>
<path d="M26 77 H70" stroke="#F2A900" stroke-width="7" stroke-linecap="round" fill="none"></path>
</svg>
<span style="font-size: 68px; font-weight: 500; letter-spacing: -1.5px; color: #1F2328">CheckRow</span>
</div>

<div style="background: #1F2328; border-radius: 20px; padding: 40px 44px; display: flex; align-items: center; gap: 22px">
<svg width="84" height="84" viewBox="0 0 96 96" aria-hidden="true">
<rect x="4" y="4" width="88" height="88" rx="24" fill="#2B3036"></rect>
<path d="M24 46 L40 62" stroke="#3CC48A" stroke-width="11" stroke-linecap="round" fill="none"></path>
<path d="M40 62 L72 28" stroke="#6E9BFF" stroke-width="11" stroke-linecap="round" fill="none"></path>
<path d="M26 77 H70" stroke="#F2B829" stroke-width="7" stroke-linecap="round" fill="none"></path>
</svg>
<span style="font-size: 68px; font-weight: 500; letter-spacing: -1.5px; color: #F1F3F4">CheckRow</span>
</div>
</div>
</div>

<div style="display: flex; gap: 40px; align-items: stretch">
<div style="flex: 1 1 0; background: #FFFFFF; border: 1px solid #E3E6EA; border-radius: 20px; padding: 28px 36px; display: flex; align-items: flex-end; gap: 36px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<svg width="128" height="128" viewBox="0 0 96 96" aria-hidden="true"><rect x="4" y="4" width="88" height="88" rx="24" fill="#FFFFFF" stroke="#DADCE0" stroke-width="2"></rect><path d="M24 46 L40 62" stroke="#22A06B" stroke-width="11" stroke-linecap="round" fill="none"></path><path d="M40 62 L72 28" stroke="{{accent}}" stroke-width="11" stroke-linecap="round" fill="none"></path><path d="M26 77 H70" stroke="#F2A900" stroke-width="7" stroke-linecap="round" fill="none"></path></svg>
<span style="font-size: 13px; color: #5F6368">128 · store</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<svg width="48" height="48" viewBox="0 0 96 96" aria-hidden="true"><rect x="4" y="4" width="88" height="88" rx="24" fill="#FFFFFF" stroke="#DADCE0" stroke-width="3"></rect><path d="M24 46 L40 62" stroke="#22A06B" stroke-width="12" stroke-linecap="round" fill="none"></path><path d="M40 62 L72 28" stroke="{{accent}}" stroke-width="12" stroke-linecap="round" fill="none"></path><path d="M26 77 H70" stroke="#F2A900" stroke-width="8" stroke-linecap="round" fill="none"></path></svg>
<span style="font-size: 13px; color: #5F6368">48 · toolbar</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<svg width="32" height="32" viewBox="0 0 96 96" aria-hidden="true"><rect x="4" y="4" width="88" height="88" rx="24" fill="#FFFFFF" stroke="#DADCE0" stroke-width="4"></rect><path d="M24 46 L40 62" stroke="#22A06B" stroke-width="14" stroke-linecap="round" fill="none"></path><path d="M40 62 L72 28" stroke="{{accent}}" stroke-width="14" stroke-linecap="round" fill="none"></path></svg>
<span style="font-size: 13px; color: #5F6368">32</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<svg width="16" height="16" viewBox="0 0 96 96" aria-hidden="true"><path d="M20 48 L40 68" stroke="#22A06B" stroke-width="18" stroke-linecap="round" fill="none"></path><path d="M40 68 L76 28" stroke="{{accent}}" stroke-width="18" stroke-linecap="round" fill="none"></path></svg>
<span style="font-size: 13px; color: #5F6368">16 · favicon</span>
</div>
</div>

<div style="flex: 1 1 0; background: #FFFFFF; border: 1px solid #E3E6EA; border-radius: 20px; padding: 28px 36px; display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 15px; font-weight: 600; color: #1F2328">Palette</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px">
<div style="display: flex; flex-direction: column; gap: 8px"><div style="height: 56px; border-radius: 12px; background: {{accent}}"></div><span style="font-size: 13px; color: #5F6368">Row blue</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><div style="height: 56px; border-radius: 12px; background: #22A06B"></div><span style="font-size: 13px; color: #5F6368">Done green #22A06B</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><div style="height: 56px; border-radius: 12px; background: #F2A900"></div><span style="font-size: 13px; color: #5F6368">Row amber #F2A900</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><div style="height: 56px; border-radius: 12px; background: #1F2328"></div><span style="font-size: 13px; color: #5F6368">Ink #1F2328</span></div>
</div>
<span style="font-size: 13px; color: #5F6368">Wordmark: Outfit Medium, −1.5 px tracking</span>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F6FEB","options":["#2F6FEB","#6A4CE0","#0F8C8C"]},"$preview":{"width":1200,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2F6FEB' };
  }
}
</script>
</body>
</html>
